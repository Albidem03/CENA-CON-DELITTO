<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Valenti — Test Firebase</title>
</head>

<body>

<script>
(async () => {

  const TEST_CODE = "321023";

  const FIREBASE_URL =
    "https://villa-valenti-test-default-rtdb.europe-west1.firebasedatabase.app";

  try {

    /* =========================================
       CARICA L'INDEX UFFICIALE
       ========================================= */

    const response = await fetch("../index.html?v=3", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Impossibile caricare l'index ufficiale.");
    }

    let html = await response.text();


    /* =========================================
       NASCONDE INFORMAZIONI SPECIALI NEL TEST
       ========================================= */

    html = html.replace(
      '<article\n                id="secretRoleBox"',
      '<article\n                style="display:none !important"\n                id="secretRoleBox"'
    );


    /* =========================================
       SOSTITUISCE IL LOGIN UFFICIALE
       CON IL LOGIN FIREBASE DEL TEST
       ========================================= */

    html = html.replace(
      "function login() {",
      "async function login() {"
    );


    const oldLoginEnd = `
  currentParticipant = participant;

  openCharacter(participant);
}`;

    const newLoginEnd = `
  if (participant.code !== "${TEST_CODE}") {
    error.textContent =
      "TEST FIREBASE · UTILIZZA IL CODICE 321023";
    return;
  }

  currentParticipant = participant;

  try {

    error.textContent =
      "COLLEGAMENTO ALL'ARCHIVIO DELLA VILLA...";

    await openCharacterFirebase(participant);

  }

  catch (firebaseError) {

    console.error(firebaseError);

    error.textContent =
      "ERRORE DI COLLEGAMENTO CON L'ARCHIVIO FIREBASE";

  }
}`;

    if (!html.includes(oldLoginEnd)) {
      throw new Error(
        "Non riesco a individuare il login nell'index ufficiale."
      );
    }

    html = html.replace(
      oldLoginEnd,
      newLoginEnd
    );


    /* =========================================
       AGGIUNGE LA FUNZIONE FIREBASE
       ========================================= */

    const firebaseScript = `

<script>

const VV_FIREBASE_URL =
  "${FIREBASE_URL}";


async function vvFirebaseRequest(
  path,
  options = {}
) {

  const response =
    await fetch(
      VV_FIREBASE_URL +
      "/" +
      path +
      ".json",
      {
        cache: "no-store",
        ...options
      }
    );

  if (!response.ok) {

    const message =
      await response.text();

    throw new Error(
      "Firebase " +
      response.status +
      ": " +
      message
    );

  }

  return response.json();

}


/* =========================================
   CREA IL RECORD SOLO AL PRIMO ACCESSO
   ========================================= */

async function vvGetOrCreatePlayer(
  participant,
  character
) {

  const path =
    "testSaluto/players/" +
    participant.code;

  /*
    Prima controlliamo se il codice
    esiste già nel database.
  */

  let existing =
    await vvFirebaseRequest(path);

  if (existing) {

    /*
      ACCESSO SUCCESSIVO
    */

    const updated = {
      ...existing,

      lastSeen:
        new Date().toISOString(),

      loginCount:
        Number(
          existing.loginCount || 1
        ) + 1
    };

    await vvFirebaseRequest(
      path,
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          lastSeen:
            updated.lastSeen,

          loginCount:
            updated.loginCount
        })
      }
    );

    return {
      firstAccess: false,
      data: updated
    };

  }


  /*
    PRIMO ACCESSO

    Il personaggio viene preso
    dall'assegnazione ufficiale
    dell'index principale.
  */

  const firstRecord = {

    characterId:
      character.id,

    characterName:
      character.name,

    characterGender:
      character.gender,

    assigned:
      true,

    firstSeen:
      new Date().toISOString(),

    lastSeen:
      new Date().toISOString(),

    loginCount:
      1

  };


  /*
    Scriviamo il record.
  */

  await vvFirebaseRequest(
    path,
    {
      method: "PUT",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify(
          firstRecord
        )
    }
  );


  /*
    Rilettura di sicurezza.

    Da questo momento Firebase
    diventa la memoria centrale.
  */

  existing =
    await vvFirebaseRequest(path);


  return {
    firstAccess: true,
    data: existing
  };

}


/* =========================================
   APERTURA DOSSIER FIREBASE
   ========================================= */

async function openCharacterFirebase(
  participant
) {

  const officialCharacterId =
    CHARACTER_ASSIGNMENTS[
      participant.id
    ];


  const officialCharacter =
    characters.find(
      item =>
        item.id ===
        officialCharacterId
    );


  if (!officialCharacter) {

    throw new Error(
      "Personaggio ufficiale non trovato."
    );

  }


  const firebaseResult =
    await vvGetOrCreatePlayer(
      participant,
      officialCharacter
    );


  /*
    Se Firebase contiene già
    un personaggio, usiamo SEMPRE quello.

    Questo significa che cambiando telefono
    il personaggio rimane identico.
  */

  const storedCharacterId =
    firebaseResult.data.characterId;


  const character =
    characters.find(
      item =>
        item.id ===
        storedCharacterId
    );


  if (!character) {

    throw new Error(
      "Il personaggio salvato su Firebase non esiste."
    );

  }


  let greeting;


  if (firebaseResult.firstAccess) {

    greeting =
      "Salve, " +
      character.name +
      ".";

  }

  else {

    greeting =
      (
        character.gender === "F"
          ?
          "Bentornata, "
          :
          "Bentornato, "
      ) +
      character.name +
      ".";

  }


  /* =========================================
     MOSTRA L'APP
     ========================================= */

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("appSection")
    .classList
    .remove("hidden");


  document
    .getElementById("greeting")
    .textContent =
      greeting;


  document
    .getElementById("characterName")
    .textContent =
      character.name;


  document
    .getElementById("characterRole")
    .textContent =
      character.role;


  document
    .getElementById(
      "characterDescription"
    )
    .textContent =
      character.description;


  document
    .getElementById(
      "characterAdvice"
    )
    .textContent =
      character.advice;


  document
    .getElementById(
      "realUserLabel"
    )
    .textContent =
      "ID: " +
      participant.name;


  const initials =
    character.name
      .split(" ")
      .map(
        part =>
          part[0]
      )
      .join("")
      .slice(0,2)
      .toUpperCase();


  document
    .getElementById(
      "characterMonogram"
    )
    .textContent =
      initials;


  /* =========================================
     NESSUN RUOLO SEGRETO NEL TEST
     ========================================= */

  const secretBox =
    document.getElementById(
      "secretRoleBox"
    );

  if (secretBox) {

    secretBox
      .classList
      .add("hidden");

    secretBox.style.display =
      "none";

  }


  /* =========================================
     HAVILAND RESTA DISPONIBILE AD ALBERTO
     ========================================= */

  const havilandNavBtn =
    document.getElementById(
      "havilandNavBtn"
    );


  const havilandMobileBtn =
    document.getElementById(
      "havilandMobileBtn"
    );


  const mobileNav =
    document.getElementById(
      "mobileNav"
    );


  if (participant.hasVoice) {

    havilandNavBtn
      .classList
      .remove("hidden");


    havilandMobileBtn
      .classList
      .remove("hidden");


    mobileNav
      .classList
      .remove("two-items");


    mobileNav
      .classList
      .add("three-items");

  }


  openTab("dossier");

}


/* =========================================
   INVIO CON TASTO ENTER
   ========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !document
        .getElementById(
          "loginSection"
        )
        .classList
        .contains("hidden")
    ) {

      login();

    }

  }
);

<\/script>
`;


    html = html.replace(
      "</body>",
      firebaseScript +
      "</body>"
    );


    /* =========================================
       APRE L'INTERFACCIA
       ========================================= */

    document.open();
    document.write(html);
    document.close();

  }

  catch (error) {

    console.error(error);

    document.body.innerHTML = `
      <div style="
        max-width:700px;
        margin:60px auto;
        padding:25px;
        color:#eee;
        background:#15100b;
        font-family:Georgia,serif;
      ">

        <h2>
          Villa Valenti — Test Firebase
        </h2>

        <p>
          Non è stato possibile avviare
          il test.
        </p>

        <p style="
          color:#c99;
          font-family:monospace;
        ">
          ${error.message}
        </p>

      </div>
    `;

  }

})();
</script>

</body>
</html>
