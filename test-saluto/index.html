<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<script>
(async () => {

  const TEST_CODE = "321023";

  const FIREBASE_URL =
    "https://villa-valenti-test-default-rtdb.europe-west1.firebasedatabase.app";

  try {

    /* =========================================
       CARICA L'INDEX UFFICIALE
       ========================================= */

    const response = await fetch("../index.html?v=3", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Impossibile caricare l'index ufficiale.");
    }

    let html = await response.text();


    /* =========================================
       NASCONDE INFORMAZIONI SPECIALI NEL TEST
       ========================================= */

    html = html.replace(
      '<article\n                id="secretRoleBox"',
      '<article\n                style="display:none !important"\n                id="secretRoleBox"'
    );


    /* =========================================
       SOSTITUISCE IL LOGIN UFFICIALE
       CON IL LOGIN FIREBASE DEL TEST
       ========================================= */

    html = html.replace(
      "function login() {",
      "async function login() {"
    );


    const oldLoginEnd = `
  currentParticipant = participant;

  openCharacter(participant);
}`;

    const newLoginEnd = `
  if (participant.code !== "${TEST_CODE}") {
    error.textContent =
      "TEST FIREBASE · UTILIZZA IL CODICE 321023";
    return;
  }

  currentParticipant = participant;

  try {

    error.textContent =
      "COLLEGAMENTO ALL'ARCHIVIO DELLA VILLA...";

    await openCharacterFirebase(participant);

  }

  catch (firebaseError) {

    console.error(firebaseError);

    error.textContent =
      "ERRORE DI COLLEGAMENTO CON L'ARCHIVIO FIREBASE";

  }
}`;

    if (!html.includes(oldLoginEnd)) {
      throw new Error(
        "Non riesco a individuare il login nell'index ufficiale."
      );
    }

    html = html.replace(
      oldLoginEnd,
      newLoginEnd
    );


    /* =========================================
       AGGIUNGE LA FUNZIONE FIREBASE
       ========================================= */

    const firebaseScript = `

<script>

const VV_FIREBASE_URL =
  "${FIREBASE_URL}";


async function vvFirebaseRequest(
  path,
  options = {}
) {

  const response =
    await fetch(
      VV_FIREBASE_URL +
      "/" +
      path +
      ".json",
      {
        cache: "no-store",
        ...options
      }
    );

  if (!response.ok) {

    const message =
      await response.text();

    throw new Error(
      "Firebase " +
      response.status +
      ": " +
      message
    );

  }

  return response.json();

}


/* =========================================
   CREA IL RECORD SOLO AL PRIMO ACCESSO
   ========================================= */

async function vvGetOrCreatePlayer(
  participant,
  character
) {

  const path =
    "testSaluto/players/" +
    participant.code;

  /*
    Prima controlliamo se il codice
    esiste già nel database.
  */

  let existing =
    await vvFirebaseRequest(path);

  if (existing) {

    /*
      ACCESSO SUCCESSIVO
    */

    const updated = {
      ...existing,

      lastSeen:
        new Date().toISOString(),

      loginCount:
        Number(
          existing.loginCount || 1
        ) + 1
    };

    await vvFirebaseRequest(
      path,
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          lastSeen:
            updated.lastSeen,

          loginCount:
            updated.loginCount
        })
      }
    );

    return {
      firstAccess: false,
      data: updated
    };

  }


  /*
    PRIMO ACCESSO

    Il personaggio viene preso
    dall'assegnazione ufficiale
    dell'index principale.
  */

  const firstRecord = {

    characterId:
      character.id,

    characterName:
      character.name,

    characterGender:
      character.gender,

    assigned:
      true,

    firstSeen:
      new Date().toISOString(),

    lastSeen:
      new Date().toISOString(),

    loginCount:
      1

  };


  /*
    Scriviamo il record.
  */

  await vvFirebaseRequest(
    path,
    {
      method: "PUT",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify(
          firstRecord
        )
    }
  );


  /*
    Rilettura di sicurezza.

    Da questo momento Firebase
    diventa la memoria centrale.
  */

  existing =
    await vvFirebaseRequest(path);


  return {
    firstAccess: true,
    data: existing
  };

}


/* =========================================
   APERTURA DOSSIER FIREBASE
   ========================================= */

async function openCharacterFirebase(
  participant
) {

  const officialCharacterId =
    CHARACTER_ASSIGNMENTS[
      participant.id
    ];


  const officialCharacter =
    characters.find(
      item =>
        item.id ===
        officialCharacterId
    );


  if (!officialCharacter) {

    throw new Error(
      "Personaggio ufficiale non trovato."
    );

  }


  const firebaseResult =
    await vvGetOrCreatePlayer(
      participant,
      officialCharacter
    );


  /*
    Se Firebase contiene già
    un personaggio, usiamo SEMPRE quello.

    Questo significa che cambiando telefono
    il personaggio rimane identico.
  */

  const storedCharacterId =
    firebaseResult.data.characterId;


  const character =
    characters.find(
      item =>
        item.id ===
        storedCharacterId
    );


  if (!character) {

    throw new Error(
      "Il personaggio salvato su Firebase non esiste."
    );

  }


  let greeting;


  if (firebaseResult.firstAccess) {

    greeting =
      "Salve, " +
      character.name +
      ".";

  }

  else {

    greeting =
      (
        character.gender === "F"
          ?
          "Bentornata, "
          :
          "Bentornato, "
      ) +
      character.name +
      ".";

  }


  /* =========================================
     MOSTRA L'APP
     ========================================= */

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("appSection")
    .classList
    .remove("hidden");


  document
    .getElementById("greeting")
    .textContent =
      greeting;


  document
    .getElementById("characterName")
    .textContent =
      character.name;


  document
    .getElementById("characterRole")
    .textContent =
      character.role;


  document
    .getElementById(
      "characterDescription"
    )
    .textContent =
      character.description;


  document
    .getElementById(
      "characterAdvice"
    )
    .textContent =
      character.advice;


  document
    .getElementById(
      "realUserLabel"
    )
    .textContent =
      "ID: " +
      participant.name;


  const initials =
    character.name
      .split(" ")
      .map(
        part =>
          part[0]
      )
      .join("")
      .slice(0,2)
      .toUpperCase();


  document
    .getElementById(
      "characterMonogram"
    )
    .textContent =
      initials;


  /* =========================================
     NESSUN RUOLO SEGRETO NEL TEST
     ========================================= */

  const secretBox =
    document.getElementById(
      "secretRoleBox"
    );

  if (secretBox) {

    secretBox
      .classList
      .add("hidden");

    secretBox.style.display =
      "none";

  }


  /* =========================================
     HAVILAND RESTA DISPONIBILE AD ALBERTO
     ========================================= */

  const havilandNavBtn =
    document.getElementById(
      "havilandNavBtn"
    );


  const havilandMobileBtn =
    document.getElementById(
      "havilandMobileBtn"
    );


  const mobileNav =
    document.getElementById(
      "mobileNav"
    );


  if (participant.hasVoice) {

    havilandNavBtn
      .classList
      .remove("hidden");


    havilandMobileBtn
      .classList
      .remove("hidden");


    mobileNav
      .classList
      .remove("two-items");


    mobileNav
      .classList
      .add("three-items");

  }


  openTab("dossier");

}


/* =========================================
   INVIO CON TASTO ENTER
   ========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !document
        .getElementById(
          "loginSection"
        )
        .classList
        .contains("hidden")
    ) {

      login();

    }

  }
);

<\/script>
`;


    html = html.replace(
      "</body>",
      firebaseScript +
      "</body>"
    );


    /* =========================================
       APRE L'INTERFACCIA
       ========================================= */

    document.open();
    document.write(html);
    document.close();

  }

  catch (error) {

    console.error(error);

    document.body.innerHTML = `
      <div style="
        max-width:700px;
        margin:60px auto;
        padding:25px;
        color:#eee;
        background:#15100b;
        font-family:Georgia,serif;
      ">

        <h2>
          Villa Valenti — Test Firebase
        </h2>

        <p>
          Non è stato possibile avviare
          il test.
        </p>

        <p style="
          color:#c99;
          font-family:monospace;
        ">
          ${error.message}
        </p>

      </div>
    `;

  }

})();
</script>
<script>
/* ============================================================
   VILLA VALENTI — FIREBASE MULTI-DISPOSITIVO
   ============================================================ */

const VV_DATABASE =
  "https://villa-valenti-test-default-rtdb.europe-west1.firebasedatabase.app";

const VV_ORGANIZER_CODE = "321023";


async function vvRequest(path, options = {}) {

  const response = await fetch(
    VV_DATABASE + "/" + path + ".json",
    {
      cache: "no-store",
      ...options
    }
  );

  if (!response.ok) {
    throw new Error(
      "Errore Firebase: " +
      response.status
    );
  }

  return response.json();
}


async function vvWrite(
  path,
  data,
  method = "PUT"
) {

  return vvRequest(
    path,
    {
      method: method,

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify(data)
    }
  );
}


/* ============================================================
   PRIMO ACCESSO / ACCESSI SUCCESSIVI
   ============================================================ */

async function vvGetPlayer(
  participant,
  officialCharacter
) {

  const path =
    "players/" +
    participant.code +
    "/public";


  let stored =
    await vvRequest(path);


  if (
    stored &&
    stored.characterId
  ) {

    const lastSeen =
      new Date().toISOString();

    const loginCount =
      Number(
        stored.loginCount || 1
      ) + 1;


    await vvWrite(
      path,
      {
        lastSeen,
        loginCount
      },
      "PATCH"
    );


    return {
      firstAccess: false,

      data: {
        ...stored,
        lastSeen,
        loginCount
      }
    };
  }


  const now =
    new Date().toISOString();


  const record = {

    characterId:
      officialCharacter.id,

    characterName:
      officialCharacter.name,

    characterGender:
      officialCharacter.gender,

    assigned: true,

    firstSeen: now,

    lastSeen: now,

    loginCount: 1
  };


  await vvWrite(
    path,
    record
  );


  stored =
    await vvRequest(path);


  return {
    firstAccess: true,
    data: stored || record
  };
}


/* ============================================================
   NUOVO LOGIN
   Sovrascrive la funzione login precedente.
   ============================================================ */

login = async function() {

  const input =
    document
      .getElementById("codeInput")
      .value
      .trim();


  const error =
    document
      .getElementById("error");


  error.textContent = "";


  const participant =
    participants.find(
      person =>
        person.code &&
        person.code === input
    );


  if (!participant) {

    error.textContent =
      "ACCESSO NEGATO · CODICE NON RICONOSCIUTO";

    return;
  }


  currentParticipant =
    participant;


  error.textContent =
    "ACCESSO ALL'ARCHIVIO...";


  try {

    await vvOpenCharacter(
      participant
    );

  }

  catch (err) {

    console.error(err);

    error.textContent =
      "ERRORE DI COLLEGAMENTO CON L'ARCHIVIO";

    currentParticipant = null;
  }
};


/* ============================================================
   APERTURA DOSSIER
   ============================================================ */

async function vvOpenCharacter(
  participant
) {

  const officialCharacterId =
    CHARACTER_ASSIGNMENTS[
      participant.id
    ];


  const officialCharacter =
    characters.find(
      character =>
        character.id ===
        officialCharacterId
    );


  if (!officialCharacter) {
    throw new Error(
      "Personaggio non trovato."
    );
  }


  const result =
    await vvGetPlayer(
      participant,
      officialCharacter
    );


  /*
    Da questo momento il personaggio
    salvato su Firebase ha la precedenza.
  */

  const character =
    characters.find(
      item =>
        item.id ===
        result.data.characterId
    );


  if (!character) {
    throw new Error(
      "Personaggio Firebase non valido."
    );
  }


  /* ---------------- SALUTO ---------------- */

  let greeting;


  if (result.firstAccess) {

    greeting =
      "Salve, " +
      character.name +
      ".";

  }

  else {

    greeting =
      (
        character.gender === "F"
          ? "Bentornata, "
          : "Bentornato, "
      ) +
      character.name +
      ".";
  }


  /* ---------------- INTERFACCIA ---------------- */

  document
    .getElementById(
      "loginSection"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "appSection"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "greeting"
    )
    .textContent =
      greeting;


  document
    .getElementById(
      "characterName"
    )
    .textContent =
      character.name;


  document
    .getElementById(
      "characterRole"
    )
    .textContent =
      character.role;


  document
    .getElementById(
      "characterDescription"
    )
    .textContent =
      character.description;


  document
    .getElementById(
      "characterAdvice"
    )
    .textContent =
      character.advice;


  document
    .getElementById(
      "realUserLabel"
    )
    .textContent =
      "ID: " +
      participant.name;


  const initials =
    character.name
      .split(" ")
      .map(
        part => part[0]
      )
      .join("")
      .slice(0,2)
      .toUpperCase();


  document
    .getElementById(
      "characterMonogram"
    )
    .textContent =
      initials;


  /* ========================================================
     DOCUMENTO PERSONALE RISERVATO

     Questa informazione NON viene mai scritta
     nel Registro Villa né nel record Firebase pubblico.
     ======================================================== */

  const secretBox =
    document.getElementById(
      "secretRoleBox"
    );


  const secretText =
    document.getElementById(
      "secretRole"
    );


  secretBox
    .classList
    .add("hidden");


  secretText.innerHTML = "";


  if (
    participant.id ===
    SPECIAL_ROLES.assassin
  ) {

    secretText.innerHTML = `
      <strong>
        DOCUMENTO PERSONALE RISERVATO
      </strong>

      <br><br>

      Ti è stato assegnato un ruolo
      speciale nella storia di Villa Valenti.

      <br><br>

      Le istruzioni definitive saranno
      disponibili qui nella versione
      completa del gioco.
    `;


    secretBox
      .classList
      .remove("hidden");
  }


  else if (
    participant.id ===
    SPECIAL_ROLES.accomplice
  ) {

    secretText.innerHTML = `
      <strong>
        DOCUMENTO PERSONALE RISERVATO
      </strong>

      <br><br>

      Ti è stato assegnato un ruolo
      speciale nella storia di Villa Valenti.

      <br><br>

      Le istruzioni definitive saranno
      disponibili qui nella versione
      completa del gioco.
    `;


    secretBox
      .classList
      .remove("hidden");
  }


  /* ---------------- HAVILAND ---------------- */

  const desktopHaviland =
    document.getElementById(
      "havilandNavBtn"
    );


  const mobileHaviland =
    document.getElementById(
      "havilandMobileBtn"
    );


  const mobileNav =
    document.getElementById(
      "mobileNav"
    );


  if (participant.hasVoice) {

    desktopHaviland
      .classList
      .remove("hidden");


    mobileHaviland
      .classList
      .remove("hidden");


    mobileNav
      .classList
      .remove("two-items");


    mobileNav
      .classList
      .add("three-items");


    await vvCreateRegistry();

  }

  else {

    desktopHaviland
      .classList
      .add("hidden");


    mobileHaviland
      .classList
      .add("hidden");


    mobileNav
      .classList
      .remove("three-items");


    mobileNav
      .classList
      .add("two-items");
  }


  openTab("dossier");


  /*
    Haviland pronuncia il saluto.
  */

  vvSpeak(greeting);
}


/* ============================================================
   VOCE HAVILAND
   ============================================================ */

function vvSpeak(text) {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  try {

    speechSynthesis.cancel();


    const voice =
      new SpeechSynthesisUtterance(
        text
      );


    voice.lang =
      "it-IT";


    voice.rate =
      0.86;


    voice.pitch =
      0.82;


    voice.volume =
      1;


    speechSynthesis.speak(
      voice
    );

  }

  catch (error) {

    console.warn(
      "Haviland:",
      error
    );
  }
}


/* ============================================================
   REGISTRO VILLA
   ============================================================ */

async function vvCreateRegistry() {

  /*
    Solo Alberto.
  */

  if (
    !currentParticipant ||
    currentParticipant.code !==
      VV_ORGANIZER_CODE
  ) {
    return;
  }


  const panel =
    document.querySelector(
      "#tab-haviland .haviland-core"
    );


  if (!panel) {
    return;
  }


  let registry =
    document.getElementById(
      "villaRegistry"
    );


  if (!registry) {

    registry =
      document.createElement(
        "div"
      );


    registry.id =
      "villaRegistry";


    registry.style.cssText = `
      margin-top:32px;
      padding-top:26px;
      border-top:
        1px solid
        rgba(202,171,111,.28);
      text-align:left;
    `;


    panel.appendChild(
      registry
    );
  }


  registry.innerHTML = `

    <div style="
      color:#e5d1ae;
      font-size:24px;
      margin-bottom:6px;
    ">
      Registro Villa
    </div>

    <div style="
      color:#8f806b;
      font-size:13px;
      margin-bottom:18px;
    ">
      Recupero dei registri
      degli ospiti...
    </div>

  `;


  const database =
    await vvRequest(
      "players"
    ) || {};


  const guests =
    participants.filter(
      participant =>
        participant.code
    );


  const entered =
    guests.filter(
      participant =>
        database[
          participant.code
        ] &&
        database[
          participant.code
        ].public &&
        database[
          participant.code
        ].public.characterId
    ).length;


  let html = `

    <div style="
      color:#e5d1ae;
      font-size:24px;
      margin-bottom:6px;
    ">
      Registro Villa
    </div>


    <div style="
      color:#8f806b;
      font-size:13px;
      line-height:1.6;
      margin-bottom:20px;
    ">

      Ospiti registrati:
      <strong style="color:#c9b38d;">
        ${entered} / ${guests.length}
      </strong>

      <br>

      Il registro contiene esclusivamente
      i dati di accesso e il personaggio
      assegnato.

    </div>


    <div style="
      display:grid;
      gap:10px;
    ">
  `;


  guests.forEach(
    participant => {

      const entry =
        database[
          participant.code
        ];


      const data =
        entry &&
        entry.public
          ? entry.public
          : null;


      let characterName =
        "Non ancora assegnato";


      let status =
        "○ Mai entrato";


      let accessCount =
        "—";


      if (
        data &&
        data.characterId
      ) {

        const character =
          characters.find(
            item =>
              item.id ===
              data.characterId
          );


        if (character) {

          characterName =
            character.name;
        }


        status =
          "✓ Accesso effettuato";


        accessCount =
          String(
            data.loginCount || 1
          );
      }


      html += `

        <div style="
          padding:14px;
          border:
            1px solid
            rgba(190,158,101,.20);
          border-radius:9px;
          background:
            rgba(255,255,255,.025);
        ">


          <div style="
            color:#dfcaab;
            font-size:15px;
            margin-bottom:6px;
          ">

            ${vvEscape(
              participant.name
            )}

          </div>


          <div style="
            color:#95836a;
            font-size:12px;
            line-height:1.65;
          ">

            Personaggio:

            <strong style="
              color:#c8af84;
            ">

              ${vvEscape(
                characterName
              )}

            </strong>

            <br>

            ${vvEscape(status)}

            · Accessi:
            ${vvEscape(accessCount)}

          </div>

        </div>
      `;
    }
  );


  html += `

    </div>


    <button
      type="button"
      onclick="vvCreateRegistry()"
      style="
        width:100%;
        margin-top:18px;
        border:
          1px solid
          rgba(194,158,96,.30);
        border-radius:8px;
        background:#211810;
        color:#c9b38d;
        padding:13px;
        cursor:pointer;
        font-family:
          Georgia,
          'Times New Roman',
          serif;
        letter-spacing:.7px;
      "
    >

      AGGIORNA REGISTRO

    </button>

  `;


  registry.innerHTML =
    html;
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function vvEscape(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}

   IMPORTANTE:
   logout() originale resta valido.

   ============================================================ */

</script>
