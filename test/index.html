/* =========================================================
   STATO TEST CONDIVISO
   ========================================================= */

async function apiGet(key){

  try{

    const r = await fetch(
      `${COUNT_API}/get/${key}`,
      {cache:"no-store"}
    );

    if(!r.ok) return 0;

    const d = await r.json();

    return Number(d.value || 0);

  }catch(e){

    return 0;

  }

}


async function apiHit(key){

  try{

    const r = await fetch(
      `${COUNT_API}/hit/${key}`,
      {cache:"no-store"}
    );

    if(!r.ok) return 0;

    const d = await r.json();

    return Number(d.value || 0);

  }catch(e){

    return 0;

  }

}


/*
  Numero della sessione test.

  Ogni volta che Alberto preme AZZERA TEST,
  questo numero aumenta.

  In questo modo gli accessi della sessione
  precedente non vengono più visualizzati.
*/

async function getTestSession(){

  return await apiGet(RESET_KEY);

}


async function resetTestSession(){

  return await apiHit(RESET_KEY);

}


/* =========================================================
   REGISTRAZIONE ACCESSO
   ========================================================= */

function playerKey(player,session){

  return (
    TEST_NAMESPACE +
    "_player_" +
    player.id +
    "_session_" +
    session
  );

}


async function registerPlayer(player){

  if(!player) return;

  const session =
    await getTestSession();

  await apiHit(
    playerKey(player,session)
  );

}


async function hasPlayerEntered(player,session){

  const value =
    await apiGet(
      playerKey(player,session)
    );

  return value > 0;

}

function forcePietroDossier(d){

  const values = {

    characterName:
      "Cesare Valli",

    characterRole:
      "Maggiordomo di Villa Valenti",

    characterDescription:
      "Conosci perfettamente la villa, le stanze e le abitudini di chi la frequenta.",

    characterAdvice:
      "Sii discreto. Osserva molto e parla soltanto quando ritieni necessario.",

    characterMonogram:
      "CV",

    greeting:
      "Salve, Cesare Valli."

  };


  for(
    const [id,text]
    of Object.entries(values)
  ){

    const el =
      d.getElementById(id);

    if(el)
      el.textContent = text;

  }


  /*
    Nel test Pietro NON deve ricevere
    informazioni da questa forzatura
    riguardo ruoli speciali.
  */

  const secret =
    d.getElementById("secretRoleBox");

  if(secret)
    secret.classList.add("hidden");

}


/* =========================================================
   LETTURA PERSONAGGIO DALL'INDEX UFFICIALE
   ========================================================= */

const characterCache = {};


/*
  Per non duplicare l'algoritmo ufficiale,
  la schermata Giocatori legge il personaggio
  direttamente dall'index ufficiale.

  Non viene mai letta né mostrata
  l'informazione Assassin/Complice.
*/

async function resolveCharacter(player){

  if(characterCache[player.id])
    return characterCache[player.id];


  /*
    Pietro è forzato manualmente
    soltanto nel test.
  */

  if(player.id === "pietro"){

    const result = {

      character:
        "Cesare Valli",

      role:
        "Maggiordomo"

    };

    characterCache[player.id] =
      result;

    return result;

  }


  return new Promise(resolve=>{

    const iframe =
      document.getElementById("resolver");


    const attempt = ()=>{

      try{

        const w =
          iframe.contentWindow;

        const d =
          iframe.contentDocument;


        if(
          !w ||
          !d ||
          typeof w.login !== "function"
        ){

          setTimeout(attempt,150);

          return;

        }


        /*
          Torniamo alla schermata login.
        */

        try{

          if(typeof w.logout === "function")
            w.logout();

        }catch(e){}


        setTimeout(()=>{

          try{

            const input =
              d.getElementById("codeInput");

            if(!input){

              resolve({
                character:"—",
                role:"—"
              });

              return;

            }


            input.value =
              player.code;


            w.login();


            setTimeout(()=>{

              const character =
                d.getElementById(
                  "characterName"
                )?.textContent?.trim()
                || "—";


              let role =
                d.getElementById(
                  "characterRole"
                )?.textContent?.trim()
                || "—";


              /*
                Nessun dato del box segreto
                viene letto.
              */


              const result = {
                character,
                role
              };


              characterCache[player.id] =
                result;


              try{

                if(
                  typeof w.logout ===
                  "function"
                )
                  w.logout();

              }catch(e){}


              resolve(result);

            },180);

          }catch(e){

            resolve({
              character:"—",
              role:"—"
            });

          }

        },80);

      }catch(e){

        setTimeout(attempt,200);

      }

    };


    attempt();

  });

}

/* =========================================================
   AGGIORNAMENTO LISTA
   ========================================================= */

let playersPoll = null;

let refreshRunning = false;


async function refreshPlayers(){

  if(refreshRunning)
    return;


  refreshRunning = true;


  try{

    const frame =
      document.getElementById(
        "baseApp"
      );


    const d =
      frame.contentDocument;


    const board =
      d?.getElementById(
        "playersBoard"
      );


    const summary =
      d?.getElementById(
        "playersSummary"
      );


    if(!board){

      refreshRunning = false;

      return;

    }


    const session =
      await getTestSession();


    const enteredPlayers = [];


    for(
      const player
      of TEST_PLAYERS
    ){

      /*
        Alberto non viene mostrato
        nel proprio elenco Giocatori.
      */

      if(player.admin)
        continue;


      const entered =
        await hasPlayerEntered(
          player,
          session
        );


      if(entered)
        enteredPlayers.push(player);

    }


    if(summary){

      summary.textContent =
        enteredPlayers.length +
        " giocator" +
        (
          enteredPlayers.length === 1
          ? "e"
          : "i"
        ) +
        " registrat" +
        (
          enteredPlayers.length === 1
          ? "o"
          : "i"
        ) +
        " in questa sessione di test.";

    }


    if(
      enteredPlayers.length === 0
    ){

      board.innerHTML = `

        <div class="players-empty">

          Nessun giocatore ha ancora
          effettuato l'accesso in questa
          sessione di test.

        </div>

      `;


      refreshRunning = false;

      return;

    }


    board.innerHTML =
      '<div class="players-loading">Caricamento personaggi...</div>';


    const cards = [];


    for(
      const player
      of enteredPlayers
    ){

      const info =
        await resolveCharacter(player);


      cards.push(`

        <div class="player-card">

          <div>

            <div class="player-real">
              ${escapeHtml(player.name)}
            </div>

            <div class="player-character">
              ${escapeHtml(info.character)}
            </div>

          </div>


          <div class="player-role">
            ${escapeHtml(
              shortRole(info.role)
            )}
          </div>

        </div>

      `);

    }


    board.innerHTML =
      cards.join("");


  }catch(e){

    console.error(e);

  }


  refreshRunning = false;

}


/* =========================================================
   RESET
   ========================================================= */

async function confirmReset(d){

  const ok =
    window.confirm(
      "Vuoi davvero azzerare il test?\n\n" +
      "L'elenco Giocatori verrà svuotato " +
      "e potrai ricominciare gli accessi da zero."
    );


  if(!ok)
    return;


  const button =
    d.getElementById(
      "resetTestBtn"
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "AZZERAMENTO...";

  }


  await resetTestSession();


  /*
    Puliamo la cache soltanto per
    rendere la nuova prova indipendente.
  */

  for(
    const key
    of Object.keys(characterCache)
  ){

    delete characterCache[key];

  }


  await refreshPlayers();


  if(button){

    button.disabled = false;

    button.textContent =
      "AZZERA TEST";

  }


  window.alert(
    "Test azzerato.\n\n" +
    "Da questo momento verranno mostrati " +
    "solo i nuovi accessi."
  );

}


/* =========================================================
   POLLING
   ========================================================= */

function startPlayersPolling(){

  if(playersPoll)
    return;


  refreshPlayers();


  playersPoll =
    setInterval(
      refreshPlayers,
      4000
    );

}


function stopPlayersPolling(){

  if(playersPoll){

    clearInterval(
      playersPoll
    );

    playersPoll = null;

  }

}


/* =========================================================
   UTILITY
   ========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function shortRole(role){

  if(!role)
    return "—";


  /*
    Per Pietro vogliamo semplicemente
    "Maggiordomo".
  */

  if(
    role.toLowerCase()
      .includes("maggiordomo")
  )
    return "Maggiordomo";


  return role;

}


/* =========================================================
   INSTALLAZIONE NELL'INDEX UFFICIALE
   ========================================================= */

function install(){

  const frame =
    document.getElementById(
      "baseApp"
    );


  let w;
  let d;


  try{

    w =
      frame.contentWindow;

    d =
      frame.contentDocument;


    if(
      !w ||
      !d ||
      typeof w.login !== "function"
    )
      return;

  }catch(e){

    return;

  }


  /*
    Evita installazioni doppie.
  */

  if(w.__villaTestInstalled)
    return;


  w.__villaTestInstalled = true;


  const originalLogin =
    w.login;


  const originalOpen =
    w.openCharacter;


  const originalLogout =
    w.logout;


  /*
    APERTURA DOSSIER
  */

  if(
    typeof originalOpen ===
    "function"
  ){

    w.openCharacter =
      function(player){

        originalOpen.call(w,player);


        if(
          player &&
          player.id ===
          "pietro_scolari"
        ){

          forcePietroDossier(d);

        }

      };

  }


  /*
    LOGIN
  */

  w.login =
    function(){

      const code =
        (
          d.getElementById(
            "codeInput"
          )?.value || ""
        ).trim();


      const player =
        TEST_PLAYERS.find(
          p => p.code === code
        );


      /*
        L'index ufficiale continua
        a decidere se il codice è valido.
      */

      originalLogin.call(w);


      setTimeout(
        async ()=>{

          const app =
            d.getElementById(
              "appSection"
            );


          const visible =
            app &&
            !app.classList.contains(
              "hidden"
            );


          if(!visible)
            return;


          /*
            Registriamo solo codici
            conosciuti dal test.
          */

          if(player){

            await registerPlayer(
              player
            );

          }


          /*
            Pietro:
            Cesare Valli soltanto
            nella versione test.
          */

          if(
            code === "900750"
          ){

            forcePietroDossier(d);

          }


          /*
            Alberto:
            abilitiamo Giocatori.
          */

          if(
            code === "321023"
          ){

            addPlayersArea(w,d);

            startPlayersPolling();

          }

        },
        100
      );

    };


  /*
    LOGOUT
  */

  w.logout =
    function(){

      stopPlayersPolling();

      originalLogout.call(w);

    };

}


/* =========================================================
   AVVIO
   ========================================================= */

document
  .getElementById("baseApp")
  .addEventListener(
    "load",
    ()=>{

      setTimeout(
        install,
        120
      );

    }
  );
